name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scripts-linting:
    name: Nexilis Scripts Linting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          cd scripts
          flake8 .

  cpp-check:
    name: cppcheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update || true
          sudo apt-get install -y cppcheck expect

      - name: Run cppcheck.py
        run: |
          pip install ./scripts
          python scripts/pre_commit/env.py
          python scripts/pre_commit/cppcheck.py

  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: python -m pip install clang-format==23.1.1

      - name: Check formatting
        run: |
          pip install ./scripts
          python scripts/pre_commit/env.py
          python scripts/pre_commit/format.py

  alias-check:
    name: Check Correct Alias Usage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run best_practises.py
        run: |
          pip install ./scripts
          python scripts/pre_commit/env.py
          python scripts/pre_commit/best_practises.py

  editorconfig-check:
    name: EditorConfig Check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run check_editorconfig.py
        run: python scripts/pre_commit/check_editorconfig.py

  cpp-tests:
    name: Run Native Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y \
          cmake \
          g++ \
          libgtest-dev \
          libboost-json-dev \

      - name: Install Nexilis
        run: |
          cd nexilis
          rm -rf build install
          cmake -B build -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/nexilis/build/install
          cmake --build build --target install -- -j2

      - name: Build and run tests
        run: |
          cd tests/nexilis
          rm -rf build
          mkdir build && cd build
          cmake .. -DNEXILIS_IS_CI=1
          cmake --build .
          ./nexilis_tests

  c-tests:
    name: Run nexilisc Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y \
          cmake \
          g++ \
          libgtest-dev \
          libboost-json-dev \

      - name: Install nexilis
        run: |
          cd nexilis
          rm -rf build install
          cmake -B build -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/nexilis/build/install
          cmake --build build --target install -- -j2

      - name: Build and run C tests
        run: |
          cd tests/nexilisc
          rm -rf build
          mkdir build && cd build
          cmake .. -DNEXILIS_IS_CI=1
          cmake --build .
          ./nexilis_c_tests

  premake-tests:
    name: Run Premake Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y g++

      - name: Install premake5
        run: |
          curl -L -o /tmp/premake.tar.gz \
            https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz
          tar -xzf /tmp/premake.tar.gz -C /tmp
          sudo install /tmp/premake5 /usr/local/bin/premake5
          premake5 --version

      - name: Run premake test
        run: make test-premake

  examples-check:
    name: Build and Run Examples
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y \
          cmake \
          g++ \
          libboost-json-dev

      - name: Build and run examples
        run: |
          pip install ./scripts
          python scripts/pre_commit/env.py
          python scripts/pre_commit/run_examples.py

  csharp-tests:
    name: Run C# Bindings Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y \
          cmake \
          g++ \
          libboost-json-dev \

      - name: Build native libraries
        run: |
          cd nexilis
          rm -rf build
          cmake -B build
          cmake --build build -- -j2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run C# tests
        run: dotnet test tests/CSharpBindings.Tests
