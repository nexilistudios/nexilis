name: Weekly release

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install release dependencies
        run: |
          python -m pip install ./scripts
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz rsync

      - name: Prepare release version
        id: version
        run: |
          python scripts/update_version.py --bump-patch
          version="$(cat VERSION.txt)"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^")" = "$GITHUB_SHA"
            git log -1 --format=%B "$tag" | grep -Fx "Release-Run: $GITHUB_RUN_ID"
            git restore VERSION.txt nexilis/Doxyfile
            git checkout --detach "$tag"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION.txt nexilis/Doxyfile
            git commit -m "Release $tag" -m "Release-Run: $GITHUB_RUN_ID"
            git tag "$tag"
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release documentation
        working-directory: nexilis
        run: |
          doxygen Doxyfile
          test -s docs/html/index.html

      - name: Push documentation to nexilistudios.github.io
        env:
          DEPLOY_KEY: ${{ secrets.NEXILIS_IO_DEPLOY_KEY }}
          DEPLOY_TOKEN: ${{ secrets.NEXILIS_IO_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "${DEPLOY_KEY:-}" ]]; then
            mkdir -p ~/.ssh
            echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            remote="git@github.com:nexilistudios/nexilistudios.github.io.git"
          else
            token="${DEPLOY_TOKEN:-${{ github.token }}}"
            remote="https://x-access-token:${token}@github.com/nexilistudios.github.io.git"
          fi

          git clone --depth 1 "$remote" site

          # Sync generated docs into the website repo, preserving custom files and assets
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='CNAME' \
            --exclude='.nojekyll' \
            --exclude='README*' \
            --exclude='LICENSE*' \
            --exclude='robots.txt' \
            --exclude='sitemap*' \
            --exclude='favicon*' \
            --exclude='apple-touch-icon*' \
            --exclude='logo*' \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.svg' \
            --exclude='*.ico' \
            --exclude='*.webp' \
            --exclude='*.gif' \
            --exclude='css/' \
            --exclude='styles/' \
            --exclude='assets/' \
            --exclude='static/' \
            --exclude='images/' \
            --exclude='img/' \
            --exclude='fonts/' \
            --exclude='js/custom/' \
            --exclude='theme/' \
            nexilis/docs/html/ site/

          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to publish"
          else
            git commit -m "docs: update for Nexilis ${RELEASE_VERSION} (${RELEASE_TAG})"
            git push
          fi

      - name: Push version commit and tag
        if: steps.version.outputs.existing != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_VERSION" == *-unstable ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "Nexilis $RELEASE_VERSION" "${flags[@]}"
          fi